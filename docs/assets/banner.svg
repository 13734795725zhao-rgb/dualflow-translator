<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="DualFlow Translator — bilingual page translation with your own API key">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.62" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="-12%" r="92%">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#1E3A8A" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#080B14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="96%" cy="118%" r="75%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#080B14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="#080B14"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1280" height="3" fill="url(#band)" opacity="0.95"/>

  <!-- kicker -->
  <text x="88" y="88"
        font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="12.5" font-weight="600" letter-spacing="3.4" fill="#38BDF8">BILINGUAL PAGE TRANSLATION</text>

  <!-- wordmark -->
  <text x="86" y="166"
        font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="86" font-weight="700" letter-spacing="-2.5" fill="url(#wordmark)">DualFlow</text>

  <text x="90" y="210"
        font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="19" fill="#9FB0D0">Read any page in two languages, with your own API key.</text>

  <text x="90" y="238"
        font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="19" fill="#9FB0D0">No backend, no middleman, no data leaves your browser.</text>

  <g font-family="'Cascadia Code', Consolas, ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="13.5" fill="#54648A">
    <text x="90" y="282">Chrome MV3</text>
    <text x="204" y="282">zero build</text>
    <text x="314" y="282">BYOK</text>
    <text x="396" y="282">11 providers</text>
    <text x="520" y="282">MIT</text>
  </g>

  <!-- bilingual rendering preview -->
  <g>
    <!-- row 1 -->
    <rect x="792" y="86" width="360" height="9" rx="4.5" fill="#64748B" opacity="0.42"/>
    <rect x="792" y="110" width="3" height="15" rx="1.5" fill="#2563EB"/>
    <rect x="805" y="112" width="286" height="11" rx="5.5" fill="#38BDF8" opacity="0.72"/>

    <!-- row 2 -->
    <rect x="792" y="150" width="318" height="9" rx="4.5" fill="#64748B" opacity="0.42"/>
    <rect x="792" y="174" width="3" height="15" rx="1.5" fill="#2563EB"/>
    <rect x="805" y="176" width="238" height="11" rx="5.5" fill="#38BDF8" opacity="0.72"/>

    <!-- row 3 -->
    <rect x="792" y="214" width="372" height="9" rx="4.5" fill="#64748B" opacity="0.42"/>
    <rect x="792" y="238" width="3" height="15" rx="1.5" fill="#2563EB"/>
    <rect x="805" y="240" width="312" height="11" rx="5.5" fill="#38BDF8" opacity="0.72"/>
  </g>

  <rect x="0" y="317" width="1280" height="1" fill="#FFFFFF" opacity="0.06"/>
</svg>
